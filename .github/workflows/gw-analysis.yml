name: GW analysis refresh

# Runs the 2026-27 notebooks after each gameweek finishes and opens a PR with the executed results.
# Times (UTC) are generated by `python scripts/gw_schedule.py generate` (last kickoff of the GW + 1 day,
# two attempts). Cron has no year, so the guard step checks the FPL API before doing any work.
on:
  workflow_dispatch:
    inputs:
      gw:
        description: "Gameweek label for the PR (blank = latest finished + data-checked)"
        required: false
  schedule:
    - cron: '0 9,21 25 8 *'  # GW1
    - cron: '0 9,21 1 9 *'  # GW2
    - cron: '0 9,21 7 9 *'  # GW3
    - cron: '0 9,21 15 9 *'  # GW4
    - cron: '0 9,21 21 9 *'  # GW5
    - cron: '0 9,21 13 10 *'  # GW6
    - cron: '0 9,21 20 10 *'  # GW7
    - cron: '0 9,21 26 10 *'  # GW8
    - cron: '0 9,21 3 11 *'  # GW9
    - cron: '0 9,21 9 11 *'  # GW10
    - cron: '0 9,21 24 11 *'  # GW11
    - cron: '0 9,21 30 11 *'  # GW12
    - cron: '0 9,21 4 12 *'  # GW13
    - cron: '0 9,21 7 12 *'  # GW14
    - cron: '0 9,21 15 12 *'  # GW15
    - cron: '0 9,21 22 12 *'  # GW16
    - cron: '0 9,21 28 12 *'  # GW17
    - cron: '0 9,21 31 12 *'  # GW18
    - cron: '0 9,21 4 1 *'  # GW19
    - cron: '0 9,21 8 1 *'  # GW20
    - cron: '0 9,21 17 1 *'  # GW21
    - cron: '0 9,21 24 1 *'  # GW22
    - cron: '0 9,21 31 1 *'  # GW23
    - cron: '0 9,21 7 2 *'  # GW24
    - cron: '0 9,21 11 2 *'  # GW25
    - cron: '0 9,21 21 2 *'  # GW26
    - cron: '0 9,21 28 2 *'  # GW27
    - cron: '0 9,21 4 3 *'  # GW28
    - cron: '0 9,21 14 3 *'  # GW29
    - cron: '0 9,21 21 3 *'  # GW30
    - cron: '0 9,21 11 4 *'  # GW31
    - cron: '0 9,21 18 4 *'  # GW32
    - cron: '0 9,21 25 4 *'  # GW33
    - cron: '0 9,21 2 5 *'  # GW34
    - cron: '0 9,21 9 5 *'  # GW35
    - cron: '0 9,21 16 5 *'  # GW36
    - cron: '0 9,21 24 5 *'  # GW37
    - cron: '0 9,21 31 5 *'  # GW38

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gw-analysis
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the gameweek to process
        id: gw
        run: |
          GW="${{ inputs.gw }}"
          [ -n "$GW" ] || GW=$(python3 scripts/gw_schedule.py latest)
          echo "latest finished + data-checked GW: '$GW'"
          echo "gw=$GW" >> "$GITHUB_OUTPUT"
          if [ -z "$GW" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # one PR per GW: skip if a refresh branch/PR already exists (any state)
          if [ -n "$(gh pr list --head "auto/gw-$GW" --state all --json number --jq '.[].number')" ]; then
            echo "GW$GW already processed"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gw.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gw.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Execute notebooks
        if: steps.gw.outputs.skip != 'true'
        run: |
          for nb in \
            analysis/07-point-source/point_source_contribution_26.ipynb \
            analysis/09-gameweek-buckets/gameweek_buckets_26.ipynb \
            analysis/10-bonus-distribution/bonus_distribution_26.ipynb; do
            jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=600 "$nb"
          done

      - name: Open pull request
        if: steps.gw.outputs.skip != 'true'
        run: |
          GW="${{ steps.gw.outputs.gw }}"
          if git diff --quiet; then echo "no notebook changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "auto/gw-$GW"
          git add analysis
          git commit -m "chore: refresh 2026-27 analysis after GW$GW"
          git push origin "auto/gw-$GW"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "auto/gw-$GW" \
            --title "Refresh analysis after GW$GW" \
            --body "Automated re-run of the 2026-27 point-source, gameweek-bucket and bonus-distribution notebooks after GW$GW finished (FPL data checked)."
